{% extends 'base.html' %}

{% block content %}
<div
    style="max-width: 500px; margin: 30px auto; padding: 30px; background: white; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <h1>Qeydiyyat 📝</h1>
    <p>Yeni dostumuz ol! Məlumatlarını doldur.</p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
        {{ messages[0] }}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <div style="text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label>Ad (Username):</label>
                <input type="text" name="username" required placeholder="Məs: ali123"
                    style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
            </div>
            <div>
                <label>Soyad:</label>
                <input type="text" name="lastname" required placeholder="Məs: Kərimov"
                    style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
            </div>
            <div>
                <label>Məktəb:</label>
                <input type="text" name="school" required placeholder="Məs: 132 saylı"
                    style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
            </div>
            <div>
                <label>Sinif:</label>
                <input type="text" name="grade" required placeholder="Məs: 5b"
                    style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
            </div>
            <div>
                <label>Yaş:</label>
                <input type="number" name="age" required placeholder="Məs: 10"
                    style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
            </div>
            <div>
                <label>Şifrə:</label>
                <input type="password" name="password" required
                    style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; margin-top: 20px;">Qeydiyyatı Bitir
            ✨</button>
    </form>

    <p style="margin-top: 20px;">
        Artıq hesabın var? <a href="{{ url_for('login') }}" style="color: var(--dark-green); font-weight: bold;">Giriş
            et</a>
    </p>
</div>
{% endblock %}
