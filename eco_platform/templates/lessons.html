{% extends 'base.html' %}

{% block content %}
<h1>Maraqlı Dərslər 📖</h1>
<p style="text-align: center; font-size: 1.2rem;">Burada təbiəti necə qoruyacağını öyrənə bilərsən.</p>

<div class="card-grid">
    {% for lesson in lessons %}
    <div class="card">
        <h3>{{ lesson.title }}</h3>
        <p>{{ lesson.description }}</p>
        <a href="{{ url_for('lesson_detail', lesson_id=lesson.id) }}" class="btn">Dərsə Başla 👉</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
