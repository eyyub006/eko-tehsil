{% extends 'base.html' %}

{% block content %}
<div style="text-align: center;">
    <a href="{{ url_for('games') }}" class="btn"
        style="background: transparent; color: var(--dark-green); border: 2px solid var(--dark-green); padding: 5px 15px; margin-bottom: 20px; display: inline-block;">⬅
        Oyunlara Qayıt</a>
    <h1>🧠 Eko Yaddaş Oyunu</h1>
    <p>Kartları çevir və eyni olanları tap!</p>

    <div style="display: flex; justify-content: center; gap: 20px; align-items: center; margin-bottom: 20px;">
        <h3 id="score-board" style="color: var(--dark-green);">Xal: <span id="game-score">0</span></h3>
        <button class="btn" onclick="initGame()">Yenidən Başla 🔄</button>
    </div>

    <div id="game-grid"
        style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 500px; margin: 0 auto;">
        <!-- Cards will be generated here -->
    </div>

    <p id="message" style="font-size: 1.5rem; font-weight: bold; margin-top: 20px; min-height: 30px;"></p>
    <a href="{{ url_for('games') }}" class="btn" style="background: gray; margin-top: 20px;">Oyunlardan Çıx</a>
</div>

<style>
    .memory-card {
        width: 100px;
        height: 100px;
        background-color: var(--ocean-blue);
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        color: white;
        transition: transform 0.3s;
    }

    .memory-card.flipped {
        background-color: white;
        color: black;
        border: 2px solid var(--ocean-blue);
        transform: rotateY(180deg);
    }

    .memory-card.matched {
        background-color: var(--primary-green);
        border-color: var(--dark-green);
        visibility: hidden;
        /* Optional: hide them or keep them visible */
        opacity: 0.5;
        pointer-events: none;
    }
</style>

<script>
    const symbols = ['🦁', '🌳', '💧', '☀️', '🌍', '♻️'];
    // Duplicate for pairs
    let cards = [...symbols, ...symbols];
    let flippedCards = [];
    let matchedPairs = 0;
    let score = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initGame() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        shuffle(cards);
        flippedCards = [];
        matchedPairs = 0;
        score = 0;
        document.getElementById('game-score').innerText = score;
        document.getElementById('message').innerText = '';

        cards.forEach((symbol, index) => {
            const card = document.createElement('div');
            card.classList.add('memory-card');
            card.dataset.symbol = symbol;
            card.dataset.index = index;
            card.innerText = '?'; // Back face
            card.onclick = () => flipCard(card);
            grid.appendChild(card);
        });
    }

    function flipCard(card) {
        if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;

        card.classList.add('flipped');
        card.innerText = card.dataset.symbol;
        flippedCards.push(card);

        if (flippedCards.length === 2) {
            checkMatch();
        }
    }

    function checkMatch() {
        const [card1, card2] = flippedCards;

        if (card1.dataset.symbol === card2.dataset.symbol) {
            playSound('correct');
            card1.classList.add('matched');
            card2.classList.add('matched');
            flippedCards = [];
            matchedPairs++;
            score += 10;
            document.getElementById('game-score').innerText = score;
            saveScore(10); // Real-time save

            if (matchedPairs === symbols.length) {
                document.getElementById('message').innerText = "🎉 Təbriklər! Hamısını tapdın!";
                playSound('correct');
            }
        } else {
            playSound('wrong');
            setTimeout(() => {
                card1.classList.remove('flipped');
                card1.innerText = '?';
                card2.classList.remove('flipped');
                card2.innerText = '?';
                flippedCards = [];
            }, 1000);
        }
    }

    initGame();
</script>
{% endblock %}
