{% extends 'base.html' %}

{% block content %}
<div style="text-align: center;">
    <a href="{{ url_for('games') }}" class="btn"
        style="background: transparent; color: var(--dark-green); border: 2px solid var(--dark-green); padding: 5px 15px; margin-bottom: 20px; display: inline-block;">⬅
        Oyunlara Qayıt</a>
    <h1>Zibil Çeşidləmə ♻️</h1>
    <p>Zibilləri sürükləyərək və ya klikləyərək düzgün qutuya at!</p>
    <div style="font-size: 1.5rem; margin: 20px;">Xal: <span id="score">0</span></div>

    <div id="game-area" style="min-height: 400px; position: relative;">
        <!-- Bins -->
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 50px;">
            <div class="bin" data-type="paper"
                style="background-color: #3A86FF; color: white; padding: 20px; border-radius: 10px; width: 120px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: end; cursor: pointer; transition: transform 0.2s;">
                <span style="font-size: 40px; pointer-events: none;">📄</span>
                Kağız
            </div>
            <div class="bin" data-type="plastic"
                style="background-color: #FFBE0B; color: black; padding: 20px; border-radius: 10px; width: 120px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: end; cursor: pointer; transition: transform 0.2s;">
                <span style="font-size: 40px; pointer-events: none;">🥤</span>
                Plastik
            </div>
            <div class="bin" data-type="glass"
                style="background-color: #06D6A0; color: white; padding: 20px; border-radius: 10px; width: 120px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: end; cursor: pointer; transition: transform 0.2s;">
                <span style="font-size: 40px; pointer-events: none;">🥛</span>
                Şüşə
            </div>
        </div>

        <!-- Item Area -->
        <div id="item-conveyor" style="height: 120px; display: flex; justify-content: center; align-items: center;">
            <div id="current-item" draggable="true"
                style="font-size: 70px; cursor: grab; user-select: none; transition: transform 0.2s;">
                <!-- JS will put emoji here -->
            </div>
        </div>

        <div id="message" style="font-size: 1.2rem; font-weight: bold; height: 30px; margin-top: 20px;"></div>
    </div>
</div>

<script>
    const items = [
        { emoji: '📰', type: 'paper', name: 'Qəzet' },
        { emoji: '📦', type: 'paper', name: 'Karton' },
        { emoji: '🥤', type: 'plastic', name: 'Plastik stəkan' },
        { emoji: '🧴', type: 'plastic', name: 'Şampun qabı' },
        { emoji: '🥛', type: 'glass', name: 'Şüşə stəkan' },
        { emoji: '🏺', type: 'glass', name: 'Vaza' }
    ];

    let currentItemData = null;
    let score = 0;
    let isSelected = false; // For click-to-move logic

    const scoreEl = document.getElementById('score');
    const itemEl = document.getElementById('current-item');
    const messageEl = document.getElementById('message');
    const bins = document.querySelectorAll('.bin');

    function spawnItem() {
        const randomIndex = Math.floor(Math.random() * items.length);
        currentItemData = items[randomIndex];
        itemEl.innerText = currentItemData.emoji;
        itemEl.style.opacity = '1';
        itemEl.style.transform = 'scale(1)';
        messageEl.innerText = "";
        isSelected = false;
        itemEl.classList.remove('selected-item');
    }

    // --- Interaction Logic (Supports both Drag&Drop and Click-Click) ---

    // 1. Click to Select
    itemEl.addEventListener('click', () => {
        if (!isSelected) {
            isSelected = true;
            itemEl.style.transform = 'scale(1.2) rotate(10deg)';
            itemEl.style.border = "2px dashed #333";
            itemEl.style.borderRadius = "50%";
            messageEl.innerText = "İndi isə atmaq istədiyin qutuya toxun! 👇";
            messageEl.style.color = "#333";
        } else {
            // Deselect
            isSelected = false;
            itemEl.style.transform = 'scale(1)';
            itemEl.style.border = "none";
            messageEl.innerText = "";
        }
    });

    // 2. Bin Click (for Click-Click)
    bins.forEach(bin => {
        bin.addEventListener('click', () => {
            if (isSelected && currentItemData) {
                checkAnswer(bin.dataset.type);
            }
        });
    });

    // 3. Drag & Drop API
    itemEl.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', currentItemData.type);
        setTimeout(() => itemEl.style.opacity = '0.5', 0);
    });

    itemEl.addEventListener('dragend', () => {
        itemEl.style.opacity = '1';
    });

    bins.forEach(bin => {
        bin.addEventListener('dragover', (e) => {
            e.preventDefault(); // Essential for allowing drop
            bin.style.transform = 'scale(1.1)';
        });

        bin.addEventListener('dragleave', () => {
            bin.style.transform = 'scale(1)';
        });

        bin.addEventListener('drop', (e) => {
            e.preventDefault();
            bin.style.transform = 'scale(1)';
            const type = e.dataTransfer.getData('text/plain');
            checkAnswer(bin.dataset.type); // Simplified check, checking current item matches logic
        });
    });

    function checkAnswer(binType) {
        if (currentItemData.type === binType) {
            // Correct
            score += 10;
            scoreEl.innerText = score;
            messageEl.innerText = "✨ Əla! Düzgündür!";
            messageEl.style.color = "green";
            // CALL BACKEND
            saveScore(10);

            // Simple animation
            itemEl.style.opacity = '0';
            setTimeout(spawnItem, 500);
        } else {
            // Incorrect
            messageEl.innerText = "❌ Səhvdir! Yenidən cəhd et.";
            messageEl.style.color = "red";
            score = Math.max(0, score - 5);
            scoreEl.innerText = score;
            // Reset selection visual
            isSelected = false;
            itemEl.style.transform = 'scale(1)';
            itemEl.style.border = "none";
        }
    }

    spawnItem();
</script>
{% endblock %}
