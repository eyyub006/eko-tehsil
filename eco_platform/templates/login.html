{% extends 'base.html' %}

{% block content %}
<div
    style="max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <h1>Giriş 🔐</h1>
    <p>Platformaya daxil olmaq üçün adını və şifrəni yaz.</p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
        {{ messages[0] }}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 20px; text-align: left;">
            <label>İstifadəçi Adı:</label>
            <input type="text" name="username" required
                style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 20px; text-align: left;">
            <label>Şifrə:</label>
            <input type="password" name="password" required
                style="width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #ddd; margin-top: 5px;">
        </div>
        <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem;">Daxil Ol ▶️</button>
    </form>

    <p style="margin-top: 20px;">
        Hesabın yoxdur? <a href="{{ url_for('register') }}"
            style="color: var(--dark-green); font-weight: bold;">Qeydiyyatdan keç</a>
    </p>
</div>
{% endblock %}
